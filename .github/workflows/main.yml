name: Update Book

on:
  push:
    branches:
      - main
    paths:
      - 'book-package.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-book:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract book
        run: |
          rm -rf pages
          rm -rf temp_book
          unzip -o book-package.zip -d temp_book
          cp -f temp_book/package/index.html ./index.html
          cp -f temp_book/package/sw.js ./sw.js
          cp -R temp_book/package/pages ./pages
          rm -rf temp_book

      - name: Commit updated book
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js pages
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update optimized book"
            git push
          fi
